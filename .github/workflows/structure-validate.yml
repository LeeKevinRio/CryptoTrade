# 結構性驗證 — 出場全網格 × 趨勢過濾開/關 × 30/90 天雙窗口
# 目的：找「兩個窗口都全標的淨EV為正」的組合，避免選出只適合單一行情的參數
# 產出 reports/structval-{天數}d-{trend}-{symbol}.csv
# 觸發：更新 backtest/.structval-trigger 並 push

name: 結構性驗證

on:
  push:
    paths:
      - "backtest/.structval-trigger"

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        window: [30, 90]
        trend: [off, on]
        symbol: [BTCUSDT, ETHUSDT, BNBUSDT, ALLOUSDT, HEMIUSDT, PLUMEUSDT, CHIPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安裝依賴
        run: pip install -r requirements.txt
      - name: 下載真實 K 線
        run: python -m backtest.fetch_klines --symbol ${{ matrix.symbol }} --interval 5m --days ${{ matrix.window }} --no-cache
      - name: 全網格掃描
        env:
          BINANCE_API_KEY: backtest-offline
          BINANCE_API_SECRET: backtest-offline
        run: |
          python -m backtest.param_sweep --real --symbol ${{ matrix.symbol }} \
            --days ${{ matrix.window }} --rank expectancy --min-trades 8 \
            --trend-filter ${{ matrix.trend }} --no-report \
            --dump-csv reports/structval-${{ matrix.window }}d-${{ matrix.trend }}-${{ matrix.symbol }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: structval-${{ matrix.window }}-${{ matrix.trend }}-${{ matrix.symbol }}
          path: reports/structval-${{ matrix.window }}d-${{ matrix.trend }}-${{ matrix.symbol }}.csv
          if-no-files-found: error

  collect:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true
      - name: 提交報告回分支
        run: |
          mkdir -p reports
          git pull --rebase origin ${{ github.ref_name }} || true
          cp /tmp/artifacts/*.csv reports/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "沒有新報告" && exit 0
          git commit -m "docs: 結構性驗證報表（Actions 自動產出）"
          git push
