# 日線長期順勢驗證：BTC/ETH 開發選規則 → 8 個老牌幣確認；資料 data.binance.vision 約 7 年日 K + 資金費
# 產出 reports/daily-trend-YYYY-MM-DD.md
name: 日線長期順勢驗證

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest/.daily-trend-trigger"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BINANCE_API_KEY: backtest-offline
      BINANCE_API_SECRET: backtest-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 驗證
        run: |
          D=$(date -u +%F); mkdir -p reports
          if grep -q "top" backtest/.daily-trend-trigger; then
            # 成交量前 10 名版本：規則不變，每天用當時過去 30 天成交額選前 10 名（point-in-time）
            ALL=$(python -m backtest.top_volume --top 100 --json)
            PICK=$(python -c "import json,sys;from backtest.candidates import EXCLUDED;print(','.join(s for s in json.loads(sys.argv[1]) if s not in EXCLUDED))" "$ALL")
            python -m backtest.daily_trend --months 72 --top-symbols "$PICK" --top-n 10 --out reports/daily-trend-top10-$D.md
          elif grep -q "emergency" backtest/.daily-trend-trigger; then
            # 緊急出場驗證：盤中暴跌先賣 6 種版本 vs 不加，開發組選、另兩組確認
            python -m backtest.emergency_exit --out reports/emergency-exit-$D.md
          elif grep -q "robust" backtest/.daily-trend-trigger; then
            # 穩健度檢查：時間留出（2017~2019 現貨）+ 均線天數敏感度，不重新選參數
            python -m backtest.daily_trend --months 86 --robust --out reports/daily-trend-robust-$D.md
          else
            python -m backtest.daily_trend --months 86 --out reports/daily-trend-$D.md
          fi
      - name: 提交報告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "docs: 日線長期順勢驗證報告（Actions 自動產出）"
          git push
