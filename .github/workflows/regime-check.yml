# 行情重放檢查 — 用最近 N 天真實 K 線重跑現行參數，
# 對照實盤同期績效：回測也虧=行情因素；回測獲利=實作落差
# 觸發：更新 backtest/.regime-check-trigger 並 push

name: 行情重放檢查

on:
  push:
    paths:
      - "backtest/.regime-check-trigger"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, DOGEUSDT,
                 HEMIUSDT, PLUMEUSDT, XPLUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安裝依賴
        run: pip install -r requirements.txt
      - name: 下載近 7 天真實 K 線
        run: python -m backtest.fetch_klines --symbol ${{ matrix.symbol }} --interval 5m --days 7 --no-cache
      - name: 重放現行參數
        env:
          BINANCE_API_KEY: backtest-offline
          BINANCE_API_SECRET: backtest-offline
        run: |
          python -m backtest.param_sweep --real --symbol ${{ matrix.symbol }} \
            --days 7 --rank expectancy --min-trades 1 --no-report \
            --dump-csv reports/regime-check-${{ matrix.symbol }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: regime-${{ matrix.symbol }}
          path: reports/regime-check-${{ matrix.symbol }}.csv
          if-no-files-found: error

  collect:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true
      - name: 提交報告回分支
        run: |
          mkdir -p reports
          git pull --rebase origin ${{ github.ref_name }} || true
          cp /tmp/artifacts/*.csv reports/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "沒有新報告" && exit 0
          git commit -m "docs: 行情重放檢查報表（Actions 自動產出）"
          git push
