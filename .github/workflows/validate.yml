# 策略上線驗證（平行版）：每個標的一個 job 同時跑一年 walk-forward，再彙整做上線關卡 + 槓桿蒙地卡羅
# 單機循序要 ~2 小時，平行後 ~20 分鐘。產出 reports/validate-YYYY-MM-DD.md
name: 策略上線驗證

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest/.validate-trigger"

permissions:
  contents: write

jobs:
  symbols:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.s.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - id: s
        # trigger 檔若有 "symbols: A,B,C" 一行就用它（例：實盤自動選出的前 20 名），否則用 settings.yaml
        run: |
          LIST=$(python3 - <<'PY'
          import json, re, yaml
          try:
              txt = open("backtest/.validate-trigger", encoding="utf-8").read()
          except FileNotFoundError:
              txt = ""
          m = re.search(r"^symbols:\s*(.+)$", txt, re.M)
          if m:
              syms = [x.strip().upper() for x in m.group(1).split(",") if x.strip()]
          else:
              syms = yaml.safe_load(open("config/settings.yaml"))["trading"]["symbols"]
          print(json.dumps(syms))
          PY
          )
          echo "$LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  wf:
    needs: symbols
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        symbol: ${{ fromJSON(needs.symbols.outputs.list) }}
    env:
      BINANCE_API_KEY: backtest-offline
      BINANCE_API_SECRET: backtest-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backtest.fetch_klines --symbol ${{ matrix.symbol }} --interval 5m --days 365
      - name: 每折重選參數
        run: python -m backtest.walk_forward --symbols ${{ matrix.symbol }} --days 365 --min-trades 15 --dump-trades out/sel-${{ matrix.symbol }}.csv
      - name: 現行固定參數
        run: python -m backtest.walk_forward --symbols ${{ matrix.symbol }} --days 365 --fixed --dump-trades out/fix-${{ matrix.symbol }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: wf-${{ matrix.symbol }}
          path: out/*.csv

  replay:
    needs: symbols
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BINANCE_API_KEY: backtest-offline
      BINANCE_API_SECRET: backtest-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 實盤期間重播（14 天，現行設定）
        run: |
          SYMS=$(python3 -c "import json,sys;print(','.join(json.loads(sys.argv[1])))" '${{ needs.symbols.outputs.list }}')
          python -m backtest.live_replay --symbols "$SYMS" --window 14 --out out/replay.md || echo "(重播失敗)" > out/replay.md
      - uses: actions/upload-artifact@v4
        with:
          name: replay
          path: out/replay.md

  gate:
    needs: [wf, replay]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pyyaml
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/wf
          merge-multiple: true
      - name: 彙整 → 上線關卡
        run: |
          merge() { head -1 "$(ls /tmp/wf/$1-*.csv | head -1)"; for f in /tmp/wf/$1-*.csv; do tail -n +2 "$f"; done; }
          merge sel > /tmp/sel.csv; merge fix > /tmp/fix.csv
          D=$(date -u +%F); mkdir -p reports
          { echo "# 策略上線驗證 $D（一年 walk-forward 樣本外）"; echo;
            cat /tmp/wf/replay.md 2>/dev/null; echo;
            echo "## 每折重選參數（36 組）"; echo '```'; python -m backtest.validation --trades /tmp/sel.csv --n-trials 36; echo '```'; echo;
            echo "## 現行固定參數（當初從 7,680 組挑出）"; echo '```'; python -m backtest.validation --trades /tmp/fix.csv --n-trials 7680; echo '```'; } > reports/validate-$D.md
          cat reports/validate-$D.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "docs: 策略上線驗證報告（Actions 自動產出）"
          git push
