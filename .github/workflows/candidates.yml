# 順勢候選策略驗證：成交量前 15 + 現役 7 標的 × 2 年 1h × walk-forward（訓練 180 天 / 測試 30 天）
# 每族樣本外交易 → 上線關卡（多重比較以三族總組合數校正）+ 槓桿蒙地卡羅
# 產出 reports/candidates-YYYY-MM-DD.md
name: 順勢候選驗證

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest/.candidates-trigger"

permissions:
  contents: write

jobs:
  symbols:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.s.outputs.list }}
      families: ${{ steps.s.outputs.families }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - id: s
        run: |
          MODE=$(cat backtest/.candidates-trigger 2>/dev/null || true)
          if echo "$MODE" | grep -q '^holdout:'; then
            # 最終確認：成交量第 16~40 名、且不在開發用名單內 → 開發期間完全沒看過的標的
            ALL=$(python -m backtest.top_volume --top 40 --json || echo '[]')
            DEV=$(python -m backtest.top_volume --top 15 --json || echo '[]')
            LIST=$(python -c "import json,yaml,sys;a=json.loads(sys.argv[1]);d=set(json.loads(sys.argv[2]))|set(yaml.safe_load(open('config/settings.yaml'))['trading']['symbols']);print(json.dumps([x for x in a if x not in d]))" "$ALL" "$DEV")
            FAM=$(echo "$MODE" | sed 's/^holdout://' | tr -d '[:space:]')
          else
            TOP=$(python -m backtest.top_volume --top 15 --json || echo '[]')
            LIST=$(python -c "import json,yaml,sys;a=json.loads(sys.argv[1]);b=yaml.safe_load(open('config/settings.yaml'))['trading']['symbols'];print(json.dumps(list(dict.fromkeys(a+b))))" "$TOP")
            FAM=""
          fi
          echo "$LIST / families=${FAM:-all}"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "families=$FAM" >> "$GITHUB_OUTPUT"

  wf:
    needs: symbols
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        symbol: ${{ fromJSON(needs.symbols.outputs.list) }}
    env:
      BINANCE_API_KEY: backtest-offline
      BINANCE_API_SECRET: backtest-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backtest.fetch_klines --symbol ${{ matrix.symbol }} --interval 1h --days 730
      - run: python -m backtest.candidates --symbol ${{ matrix.symbol }} --days 730 --out out ${{ needs.symbols.outputs.families && format('--families {0}', needs.symbols.outputs.families) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: cand-${{ matrix.symbol }}
          path: out/*.csv
          if-no-files-found: ignore    # 被排除的標的（新幣、非加密資產）不產出

  gate:
    needs: [symbols, wf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/c
          merge-multiple: true
      - name: 彙整 → 上線關卡
        run: |
          D=$(date -u +%F); mkdir -p reports
          FAM="${{ needs.symbols.outputs.families }}"
          if [ -n "$FAM" ]; then
            NT=1; TAG="holdout-$FAM"; TITLE="最終確認（開發期間沒看過的標的，只驗 $FAM，不再選族）"
            FAMS="$FAM"
          else
            NT=$(python -c "from backtest.candidates import total_trials;print(total_trials())")
            TAG="dev"; TITLE="開發輪（多重比較校正 $NT 組）"
            FAMS=$(python -c "from backtest.candidates import FAMILIES;print(' '.join(FAMILIES))")
          fi
          OUT=reports/candidates-$TAG-$D.md
          {
            echo "# 順勢候選驗證 $D — $TITLE"; echo
            echo "2 年 1h，walk-forward（訓練 180 天 / 測試 30 天），以 R 倍數檢定、風險定倉蒙地卡羅"; echo
            echo "標的：$(ls /tmp/c/*.csv | sed 's#.*/##;s#\.csv##;s#^.*-##' | sort -u | tr '\n' ' ')"; echo
            for fam in $FAMS; do
              ls /tmp/c/$fam-*.csv >/dev/null 2>&1 || continue
              f=/tmp/$fam.csv
              head -1 "$(ls /tmp/c/$fam-*.csv | head -1)" > $f
              for x in /tmp/c/$fam-*.csv; do tail -n +2 "$x" >> $f; done
              echo "## $fam"; echo '```'
              python -m backtest.validation --trades $f --n-trials $NT --unit r
              echo '```'; echo
            done
          } > $OUT
          cat $OUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "docs: 順勢候選驗證報告（Actions 自動產出）"
          git push
