# === CryptoTrade 全域設定 ===

trading:
  symbols:
    - BTCUSDT
    - ETHUSDT
  timeframes:
    - 1m
    - 5m
    - 15m
    - 1h
    - 4h
  use_testnet: true

# 雙 bot 配置：spot（保守）與 futures（高風險）
bots:
  spot:
    enabled: false                  # 暫時停用：spot testnet 服務 502 + API key 無權限
    mode: spot
    leverage: 1
    only_long: true                 # 現貨只能做多
    strategy:
      min_signals: 3
      strong_signal_threshold: 70
      medium_signal_threshold: 60
      weights:
        rsi: 0.20
        bollinger: 0.15
        macd: 0.20
        volume: 0.15
        multi_timeframe: 0.15
        funding_rate: 0.15
      dip_buyer:
        rsi_oversold: 30
        rsi_15m_threshold: 35
        volume_multiplier: 1.5
        support_tolerance_pct: 0.5
      short_seller:
        rsi_overbought: 70
        rsi_15m_threshold: 65
        funding_rate_high: 0.05
        resistance_tolerance_pct: 0.5
    risk:
      take_profit:
        level_1_pct: 1.5            # 較容易觸發鎖第一階利潤
        level_1_close_pct: 50
        level_2_pct: 3.0
        level_2_close_pct: 30
        level_3_pct: 5.0
        level_3_close_pct: 20
      trailing_stop:
        activation_pct: 1.2         # 摸到 L1 前就啟動追蹤
        callback_pct: 0.6
      time_stop_seconds: 3600
      stop_loss_pct: 2.5            # 給 5m 噪音空間，避免被掃損
      max_position_pct: 10
      max_concurrent_positions: 2
      max_daily_loss_pct: 3.0
      max_daily_trades: 15
      entry_batches:
        - pct: 50
          offset: 0.0
        - pct: 50
          offset: -1.5

  futures:
    enabled: true
    mode: futures
    leverage: 10                    # 高風險：10x
    only_long: false
    strategy:
      min_signals: 4                # 收緊：3 → 4，過濾低品質訊號（避免進場 15 秒被滑點吃光）
      strong_signal_threshold: 70   # 收緊：65 → 70
      medium_signal_threshold: 62   # 收緊：58 → 62
      weights:
        rsi: 0.20
        bollinger: 0.15
        macd: 0.20
        volume: 0.15
        multi_timeframe: 0.15
        funding_rate: 0.15
      dip_buyer:
        rsi_oversold: 32            # 略放寬
        rsi_15m_threshold: 38
        volume_multiplier: 1.3
        support_tolerance_pct: 0.5
      short_seller:
        rsi_overbought: 68
        rsi_15m_threshold: 62
        funding_rate_high: 0.03
        resistance_tolerance_pct: 0.5
    risk:
      take_profit:
        level_1_pct: 0.7            # 收緊：0.3 → 0.7，讓贏的單跑久一點
        level_1_close_pct: 40       # L1 平倉比例下修，留更多倉位給 L2/L3 與 trailing
        level_2_pct: 1.5            # 0.8 → 1.5
        level_2_close_pct: 35
        level_3_pct: 3.0            # 1.8 → 3.0
        level_3_close_pct: 25
      trailing_stop:
        activation_pct: 1.0         # 0.5 → 1.0，到 +1% 才啟動追蹤
        callback_pct: 0.5           # 回撤 0.5% 平倉
      time_stop_seconds: 2400
      time_stop_no_movement_pct: 0.4  # 倉位生命週期 max excursion 兩側都 < 0.4% 才視為「無波動」可平
      stop_loss_pct: 2.0            # 2.0% — 留足噪音空間（10x → 帳戶 -20%）
      max_position_pct: 20          # 高風險：單筆 20%
      max_concurrent_positions: 3
      max_daily_loss_pct: 3.0       # ⚠️ 硬牆，不放寬
      max_daily_trades: 50
      entry_batches:
        - pct: 50
          offset: 0.0
        - pct: 30
          offset: -0.5
        - pct: 20
          offset: -1.0

notification:
  enabled: true
  telegram: true

database:
  url: "sqlite+aiosqlite:///cryptotrade.db"

logging:
  level: INFO
  file: logs/cryptotrade.log

web:
  enabled: true
  host: 127.0.0.1               # 預設僅本機可連，要對外請改 0.0.0.0 並設定 WEB_AUTH_TOKEN
  port: 8788
