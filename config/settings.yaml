# === CryptoTrade 全域設定 ===

trading:
  symbols:
    - BTCUSDT
    - ETHUSDT
  timeframes:
    - 1m
    - 5m
    - 15m
    - 1h
    - 4h
  use_testnet: true

# 雙 bot 配置：spot（保守）與 futures（高風險）
bots:
  spot:
    enabled: false                  # 暫時停用：spot testnet 服務 502 + API key 無權限
    mode: spot
    leverage: 1
    only_long: true                 # 現貨只能做多
    strategy:
      min_signals: 3
      strong_signal_threshold: 70
      medium_signal_threshold: 60
      weights:                        # 總和=1.0；消息面權重最大（技術+消息面為主）
        rsi: 0.18
        bollinger: 0.12
        macd: 0.15
        volume: 0.10
        multi_timeframe: 0.15
        funding_rate: 0.10
        sentiment: 0.20
      sentiment_threshold: 0.2        # |bias| >= 此值才把消息面計入評分
      dip_buyer:
        rsi_oversold: 30
        rsi_15m_threshold: 35
        volume_multiplier: 1.5
        support_tolerance_pct: 0.5
      short_seller:
        rsi_overbought: 70
        rsi_15m_threshold: 65
        funding_rate_high: 0.05
        resistance_tolerance_pct: 0.5
    risk:
      take_profit:
        level_1_pct: 1.5            # 較容易觸發鎖第一階利潤
        level_1_close_pct: 50
        level_2_pct: 3.0
        level_2_close_pct: 30
        level_3_pct: 5.0
        level_3_close_pct: 20
      trailing_stop:
        activation_pct: 1.2         # 摸到 L1 前就啟動追蹤
        callback_pct: 0.6
      time_stop_seconds: 3600
      stop_loss_pct: 2.5            # 給 5m 噪音空間，避免被掃損
      max_position_pct: 10
      max_concurrent_positions: 2
      max_daily_loss_pct: 3.0
      max_daily_trades: 15
      max_consecutive_losses: 4         # 連敗 4 筆即停止當日開倉（0 = 停用）
      entry_batches:
        - pct: 50
          offset: 0.0
        - pct: 50
          offset: -1.5

  futures:
    enabled: true
    mode: futures
    leverage: 15                    # 激進模式：10 → 15x
    only_long: false
    strategy:
      # ── 激進模式：放寬進場條件以提高交易頻率（使用者明確接受大震盪）──
      min_signals: 3                # 4 → 3，較少共振條件即可進場
      strong_signal_threshold: 62   # 70 → 62，較容易觸發全額建倉
      medium_signal_threshold: 50   # 62 → 50，同時是 is_actionable 門檻（原寫死 60，現已可設定）
      weights:                        # 總和=1.0；消息面權重最大（技術+消息面為主）
        rsi: 0.18
        bollinger: 0.12
        macd: 0.15
        volume: 0.10
        multi_timeframe: 0.15
        funding_rate: 0.10
        sentiment: 0.20
      sentiment_threshold: 0.2        # |bias| >= 此值才把消息面計入評分
      dip_buyer:
        rsi_oversold: 38            # 32 → 38，超賣判定放寬，訊號變多
        rsi_15m_threshold: 45
        volume_multiplier: 1.1      # 1.3 → 1.1，量能門檻放寬
        support_tolerance_pct: 0.8
      short_seller:
        rsi_overbought: 62          # 68 → 62，超買判定放寬
        rsi_15m_threshold: 56
        funding_rate_high: 0.02     # 0.03 → 0.02
        resistance_tolerance_pct: 0.8
    risk:
      # ── 出場參數來自 param_sweep 掃描結果（156 組中最佳）──
      # 基準 SL2.0/TP0.7-1.5-3.0/trail0.5 → payoff 0.35、總盈虧 -5.8%
      # 本組 SL1.5/TP1.5-2.5-4.5/trail0.4 → payoff 0.71、總盈虧 -1.9%
      take_profit:
        level_1_pct: 1.5            # 0.7 → 1.5，第一階拉遠，避免贏太小
        level_1_close_pct: 40
        level_2_pct: 2.5            # 1.5 → 2.5
        level_2_close_pct: 35
        level_3_pct: 4.5            # 3.0 → 4.5，讓大單跑滿
        level_3_close_pct: 25
      trailing_stop:
        activation_pct: 1.0
        callback_pct: 0.4           # 0.5 → 0.4，回撤更早鎖利
      time_stop_seconds: 2400
      time_stop_no_movement_pct: 0.4  # 倉位生命週期 max excursion 兩側都 < 0.4% 才視為「無波動」可平
      stop_loss_pct: 1.5            # 2.0 → 1.5，配合 15x 控制單筆風險
      # ── 部位放大：單筆 25% × 15x = 3.75x 帳戶名目；3 筆並行 → 佔用 75% 保證金（留 25% 緩衝）──
      max_position_pct: 25          # 20 → 25
      max_concurrent_positions: 3   # 維持 3：25% × 3 = 75% 保證金，再高會保證金不足下不了單
      max_daily_loss_pct: 25.0      # 3 → 25：單筆最大虧損約帳戶 5.6%，需容納數筆才不會一虧就停
      max_daily_trades: 150         # 50 → 150，配合高頻
      max_consecutive_losses: 5     # 3 → 5，放寬熔斷讓策略有機會跑（仍保留級聯保護）
      entry_batches:
        - pct: 50
          offset: 0.0
        - pct: 30
          offset: -0.5
        - pct: 20
          offset: -1.0

notification:
  enabled: true
  telegram: true

# 消息面/市場情緒（技術分析之外的第 7 個加權訊號）
sentiment:
  enabled: true
  refresh_seconds: 900            # 15 分鐘更新一次（F&G 每日更新、新聞數分鐘）
  http_timeout: 6.0               # 單一來源逾時秒數；逾時不阻斷交易、退回中性
  fear_greed_weight: 0.6          # 市場情緒（反向：恐慌挺多、貪婪挺空）
  news_weight: 0.4                # 新聞情緒（順勢：利多挺多、利空挺空）
  news_feeds:                     # 免費 RSS，無需金鑰
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://cryptopotato.com/feed/

database:
  url: "sqlite+aiosqlite:///cryptotrade.db"

logging:
  level: INFO
  file: logs/cryptotrade.log

web:
  enabled: true
  host: 127.0.0.1               # 預設僅本機可連，要對外請改 0.0.0.0 並設定 WEB_AUTH_TOKEN
  port: 8788
