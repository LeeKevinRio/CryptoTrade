# === CryptoTrade 全域設定 ===

trading:
  # 交易對須通過「現行出場參數 + 扣費 0.08%/筆 後淨EV > 0」檢定才納入
  # （2026-08-16 90天真實K線全網格，見 reports/sweep-full-*.csv）：
  #   現役  BTC +0.033  ETH +0.027  SOL +0.048  BNB +0.056  DOGE +0.094（%/筆）
  #   排除  XRP -0.415  ADA -0.075  AVAX -0.027  LINK -0.022  LTC -0.034
  # 注意：被排除者用「各自最佳參數」可為正，但那是單標的過擬合，不採用
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - BNBUSDT
    - DOGEUSDT
  timeframes:
    - 1m
    - 5m
    - 15m
    - 1h
    - 4h
  use_testnet: true

# 雙 bot 配置：spot（保守）與 futures（高風險）
bots:
  spot:
    enabled: false                  # 暫時停用：spot testnet 服務 502 + API key 無權限
    mode: spot
    leverage: 1
    only_long: true                 # 現貨只能做多
    strategy:
      min_signals: 3
      strong_signal_threshold: 70
      medium_signal_threshold: 60
      weights:                        # 總和=1.0；消息面權重最大（技術+消息面為主）
        rsi: 0.18
        bollinger: 0.12
        macd: 0.15
        volume: 0.10
        multi_timeframe: 0.15
        funding_rate: 0.10
        sentiment: 0.20
        external: 0.0                 # TradingView webhook 訊號權重
                                      # 預設 0 = 收訊號但不影響評分（先觀察再調高，例如 0.25）
                                      # 調高時請同步下修其他權重，維持總和 1.0
      sentiment_threshold: 0.2        # |bias| >= 此值才把消息面計入評分
      external_threshold: 0.2         # |bias| >= 此值才把外部訊號計入評分
      dip_buyer:
        rsi_oversold: 30
        rsi_15m_threshold: 35
        volume_multiplier: 1.5
        support_tolerance_pct: 0.5
      short_seller:
        rsi_overbought: 70
        rsi_15m_threshold: 65
        funding_rate_high: 0.05
        resistance_tolerance_pct: 0.5
    risk:
      take_profit:
        level_1_pct: 1.5            # 較容易觸發鎖第一階利潤
        level_1_close_pct: 50
        level_2_pct: 3.0
        level_2_close_pct: 30
        level_3_pct: 5.0
        level_3_close_pct: 20
      trailing_stop:
        activation_pct: 1.2         # 摸到 L1 前就啟動追蹤
        callback_pct: 0.6
      time_stop_seconds: 3600
      stop_loss_pct: 2.5            # 給 5m 噪音空間，避免被掃損
      max_position_pct: 10
      max_concurrent_positions: 2
      max_daily_loss_pct: 3.0
      max_daily_trades: 15
      max_consecutive_losses: 4         # 連敗 4 筆即停止當日開倉（0 = 停用）
      entry_batches:
        - pct: 50
          offset: 0.0
        - pct: 50
          offset: -1.5

  futures:
    enabled: true
    mode: futures
    leverage: 25                    # 測試倉激進設定（使用者要求 10x~100x 區間）
    margin_type: CROSSED            # 明確鎖定全倉：逐倉下 25x 爆倉線約 3.5%，會先於 4% 停損觸發
                                    # 全倉以整體淨值撐倉，爆倉幅度 ≈ 淨值/總名目，見下方部位配置
    only_long: false
    strategy:
      # ── 激進模式：放寬進場條件以提高交易頻率（使用者明確接受大震盪）──
      min_signals: 3                # 4 → 3，較少共振條件即可進場
      strong_signal_threshold: 62   # 70 → 62，較容易觸發全額建倉
      medium_signal_threshold: 50   # 62 → 50，同時是 is_actionable 門檻（原寫死 60，現已可設定）
      weights:                        # 總和=1.0；消息面權重最大（技術+消息面為主）
        rsi: 0.18
        bollinger: 0.12
        macd: 0.15
        volume: 0.10
        multi_timeframe: 0.15
        funding_rate: 0.10
        sentiment: 0.20
        external: 0.0                 # TradingView webhook 訊號權重
                                      # 預設 0 = 收訊號但不影響評分（先觀察再調高，例如 0.25）
                                      # 調高時請同步下修其他權重，維持總和 1.0
      sentiment_threshold: 0.2        # |bias| >= 此值才把消息面計入評分
      external_threshold: 0.2         # |bias| >= 此值才把外部訊號計入評分
      # 高時框趨勢閘門：4h EMA 斜率向下擋多單、向上擋空單（只擋不加分）
      # 2026-08-16 A/B 結論（90天、現行出場參數、扣費後）：維持關閉。
      #   BTC +0.7% ETH +5.9% BNB +1.8% 改善，但 SOL 淨EV 轉負（-16.0%），
      #   合計淨盈虧 +18.2% → +10.7%，不符「4/4 皆改善才開」的預定標準。
      #   工具鏈保留（trend-ab workflow），市場結構改變時可重測。
      trend_filter:
        enabled: false
        timeframe: "4h"
        ema_period: 50
        slope_lookback: 6             # 斜率取 6 根 4h（一天）
        slope_threshold_pct: 0.3      # |斜率| < 0.3% 視為中性不過濾
      dip_buyer:
        rsi_oversold: 38            # 32 → 38，超賣判定放寬，訊號變多
        rsi_15m_threshold: 45
        volume_multiplier: 1.1      # 1.3 → 1.1，量能門檻放寬
        support_tolerance_pct: 0.8
      short_seller:
        rsi_overbought: 62          # 68 → 62，超買判定放寬
        rsi_15m_threshold: 56
        funding_rate_high: 0.02     # 0.03 → 0.02
        resistance_tolerance_pct: 0.8
    risk:
      # ── 出場參數：2026-08-16 全網格跨標的驗證（90天真實K線，保真模式）──
      # 方法：四標的各掃 1920 組全量輸出，每組扣來回手續費 0.08%/筆 後，
      # 要求四標的淨期望值同時 > 0（僅 10/1920 組通過），按最差標的淨EV排序。
      # 第1名（本組）SL4.0/tr0.4/時停40分/0.2：
      #   淨EV  BTC +0.033  ETH +0.027  SOL +0.048  BNB +0.056（%/筆，4/4 正）
      #   勝率 75~81%，合計淨盈虧 +18.2%，總筆數 450（90天）
      # 對照前組 SL3.0/tr0.4/時停20分/0.2：BTC 淨EV -0.078 轉負（筆數多、手續費侵蝕），3/4 正。
      # 完整數據：reports/sweep-full-*.csv、reports/sweep-futures-real-*-2026-08-15.md
      # ⚠️ 淨EV僅 +0.03~0.06%/筆，屬微弱優勢。用 scripts/check_edge.py 持續追蹤。
      take_profit:
        level_1_pct: 1.5
        level_1_close_pct: 40
        level_2_pct: 2.5
        level_2_close_pct: 35
        level_3_pct: 3.0
        level_3_close_pct: 25
      # 階梯停利掛成 reduce-only + post-only 限價單（maker 費率約為 taker 一半）。
      # 淨EV僅 0.03~0.06%/筆而來回 taker 費約 0.08%，省下的費用直接放大淨利。
      # 軟體端保留 trailing / 時停 / 停損備援；掛單成交由 30s 對帳入帳。
      use_maker_tp: true
      trailing_stop:
        activation_pct: 1.0
        callback_pct: 0.4
      time_stop_seconds: 2400         # 1200 → 2400（40分）：20分過急，churn 多、手續費侵蝕
      time_stop_no_movement_pct: 0.2
      stop_loss_pct: 4.0              # 3.0 → 4.0：空頭高波動窗口 3% 易被掃損後反彈
      max_stop_pct: 6.0               # 上限保留，讓 ATR 動態停損仍可放寬
      # ── 部位公式：notional = 餘額 × max_position_pct × leverage ──
      # 槓桿與單筆% 是可互換的乘數；全倉下決定生死的是「總名目/淨值」而非槓桿數字
      #   25x × 12% = 單筆名目 3.0x 帳戶；4 筆並行 → 總名目 12x
      #   → 爆倉需 4 個標的同向不利約 8.3%（12x 的倒數）
      # 對照：若維持 18% 不動，25x 會變成總名目 18x → 爆倉僅需 5.6%，過於接近日常波動
      max_position_pct: 12          # 18 → 12，抵銷槓桿提高，把總名目控制在 12x
      max_concurrent_positions: 4
      max_daily_loss_pct: 25.0      # 單筆停損虧帳戶 12%（4.0% × 3.0x），容納約 2 筆
      max_daily_trades: 150         # 50 → 150，配合高頻
      max_consecutive_losses: 5     # 3 → 5，放寬熔斷讓策略有機會跑（仍保留級聯保護）
      entry_batches:
        - pct: 50
          offset: 0.0
        - pct: 30
          offset: -0.5
        - pct: 20
          offset: -1.0

notification:
  enabled: true
  telegram: true

# 消息面/市場情緒（技術分析之外的第 7 個加權訊號）
sentiment:
  enabled: true
  refresh_seconds: 900            # 15 分鐘更新一次（F&G 每日更新、新聞數分鐘）
  http_timeout: 6.0               # 單一來源逾時秒數；逾時不阻斷交易、退回中性
  fear_greed_weight: 0.6          # 市場情緒（反向：恐慌挺多、貪婪挺空）
  news_weight: 0.4                # 新聞情緒（順勢：利多挺多、利空挺空）
  news_feeds:                     # 免費 RSS，無需金鑰
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://cryptopotato.com/feed/

database:
  url: "sqlite+aiosqlite:///cryptotrade.db"

logging:
  level: INFO
  file: logs/cryptotrade.log

web:
  enabled: true
  host: 127.0.0.1               # 預設僅本機可連，要對外請改 0.0.0.0 並設定 WEB_AUTH_TOKEN
  port: 8899                    # 變更時記得同步 run_bot.bat 的重複啟動守門 port
