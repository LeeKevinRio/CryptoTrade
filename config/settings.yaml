# === CryptoTrade 全域設定 ===

trading:
  # 交易對經真實 K 線驗證（45天，含手續費）才納入；期望值為負者不加入
  #   BTCUSDT +0.074%/筆  ETHUSDT +0.232%  SOLUSDT +0.304%  BNBUSDT +0.457%
  #   排除：XRPUSDT -0.046%、DOGEUSDT -0.016%
  # 增加標的是在不降低訊號品質的前提下提高頻率（1.58 → 3.05 筆/天）
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - BNBUSDT
  timeframes:
    - 1m
    - 5m
    - 15m
    - 1h
    - 4h
  use_testnet: true

# 雙 bot 配置：spot（保守）與 futures（高風險）
bots:
  spot:
    enabled: false                  # 暫時停用：spot testnet 服務 502 + API key 無權限
    mode: spot
    leverage: 1
    only_long: true                 # 現貨只能做多
    strategy:
      min_signals: 3
      strong_signal_threshold: 70
      medium_signal_threshold: 60
      weights:                        # 總和=1.0；消息面權重最大（技術+消息面為主）
        rsi: 0.18
        bollinger: 0.12
        macd: 0.15
        volume: 0.10
        multi_timeframe: 0.15
        funding_rate: 0.10
        sentiment: 0.20
        external: 0.0                 # TradingView webhook 訊號權重
                                      # 預設 0 = 收訊號但不影響評分（先觀察再調高，例如 0.25）
                                      # 調高時請同步下修其他權重，維持總和 1.0
      sentiment_threshold: 0.2        # |bias| >= 此值才把消息面計入評分
      external_threshold: 0.2         # |bias| >= 此值才把外部訊號計入評分
      dip_buyer:
        rsi_oversold: 30
        rsi_15m_threshold: 35
        volume_multiplier: 1.5
        support_tolerance_pct: 0.5
      short_seller:
        rsi_overbought: 70
        rsi_15m_threshold: 65
        funding_rate_high: 0.05
        resistance_tolerance_pct: 0.5
    risk:
      take_profit:
        level_1_pct: 1.5            # 較容易觸發鎖第一階利潤
        level_1_close_pct: 50
        level_2_pct: 3.0
        level_2_close_pct: 30
        level_3_pct: 5.0
        level_3_close_pct: 20
      trailing_stop:
        activation_pct: 1.2         # 摸到 L1 前就啟動追蹤
        callback_pct: 0.6
      time_stop_seconds: 3600
      stop_loss_pct: 2.5            # 給 5m 噪音空間，避免被掃損
      max_position_pct: 10
      max_concurrent_positions: 2
      max_daily_loss_pct: 3.0
      max_daily_trades: 15
      max_consecutive_losses: 4         # 連敗 4 筆即停止當日開倉（0 = 停用）
      entry_batches:
        - pct: 50
          offset: 0.0
        - pct: 50
          offset: -1.5

  futures:
    enabled: true
    mode: futures
    leverage: 25                    # 測試倉激進設定（使用者要求 10x~100x 區間）
    margin_type: CROSSED            # 明確鎖定全倉：逐倉下 25x 爆倉線約 3.5%，會先於 4% 停損觸發
                                    # 全倉以整體淨值撐倉，爆倉幅度 ≈ 淨值/總名目，見下方部位配置
    only_long: false
    strategy:
      # ── 激進模式：放寬進場條件以提高交易頻率（使用者明確接受大震盪）──
      min_signals: 3                # 4 → 3，較少共振條件即可進場
      strong_signal_threshold: 62   # 70 → 62，較容易觸發全額建倉
      medium_signal_threshold: 50   # 62 → 50，同時是 is_actionable 門檻（原寫死 60，現已可設定）
      weights:                        # 總和=1.0；消息面權重最大（技術+消息面為主）
        rsi: 0.18
        bollinger: 0.12
        macd: 0.15
        volume: 0.10
        multi_timeframe: 0.15
        funding_rate: 0.10
        sentiment: 0.20
        external: 0.0                 # TradingView webhook 訊號權重
                                      # 預設 0 = 收訊號但不影響評分（先觀察再調高，例如 0.25）
                                      # 調高時請同步下修其他權重，維持總和 1.0
      sentiment_threshold: 0.2        # |bias| >= 此值才把消息面計入評分
      external_threshold: 0.2         # |bias| >= 此值才把外部訊號計入評分
      dip_buyer:
        rsi_oversold: 38            # 32 → 38，超賣判定放寬，訊號變多
        rsi_15m_threshold: 45
        volume_multiplier: 1.1      # 1.3 → 1.1，量能門檻放寬
        support_tolerance_pct: 0.8
      short_seller:
        rsi_overbought: 62          # 68 → 62，超買判定放寬
        rsi_15m_threshold: 56
        funding_rate_high: 0.02     # 0.03 → 0.02
        resistance_tolerance_pct: 0.8
    risk:
      # ── 出場參數：保真回測 + 4 標的樣本外驗證（90天真實K線，已扣手續費）──
      # 修好回測保真度（真時框重取樣＋情緒回放＋時間停損模擬）後重新驗證，
      # 先前基於不忠實回測的參數全部失效。跨標的合計淨報酬：
      #   前一版 SL4.0/tr0.4/時停40分  → BTC -12.8 ETH -1.6 SOL -12.6 BNB -4.9 = -32.0（0/4 正）
      #   BTC 掃描第1名 SL3.0/tr0.8/時停240分 → 僅 BTC 正，其餘全負 = -34.5（1/4）純過擬合
      #   本組   SL3.0/tr0.4/時停20分   → BTC +1.7 ETH +1.6 SOL -10.1 BNB +6.6 = -0.2（3/4 正）
      # 本組是唯一 3/4 標的為正、期望值約零的組合；其餘皆顯著為負。
      # ⚠️ 期望值僅「約等於零」，非已證實的 edge。用 scripts/check_edge.py 持續追蹤。
      take_profit:
        level_1_pct: 1.5
        level_1_close_pct: 40
        level_2_pct: 2.5
        level_2_close_pct: 35
        level_3_pct: 3.0
        level_3_close_pct: 25
      trailing_stop:
        activation_pct: 1.0
        callback_pct: 0.4
      time_stop_seconds: 1200         # 2400 → 1200（20分）：跨標的驗證最穩健
      time_stop_no_movement_pct: 0.2  # 0.4 → 0.2，無波動判定收緊
      stop_loss_pct: 3.0              # 4.0 → 3.0
      max_stop_pct: 6.0               # 上限保留，讓 ATR 動態停損仍可放寬
      # ── 部位公式：notional = 餘額 × max_position_pct × leverage ──
      # 槓桿與單筆% 是可互換的乘數；全倉下決定生死的是「總名目/淨值」而非槓桿數字
      #   25x × 12% = 單筆名目 3.0x 帳戶；4 筆並行 → 總名目 12x
      #   → 爆倉需 4 個標的同向不利約 8.3%（12x 的倒數）
      # 對照：若維持 18% 不動，25x 會變成總名目 18x → 爆倉僅需 5.6%，過於接近日常波動
      max_position_pct: 12          # 18 → 12，抵銷槓桿提高，把總名目控制在 12x
      max_concurrent_positions: 4
      max_daily_loss_pct: 25.0      # 單筆停損虧帳戶 12%（4.0% × 3.0x），容納約 2 筆
      max_daily_trades: 150         # 50 → 150，配合高頻
      max_consecutive_losses: 5     # 3 → 5，放寬熔斷讓策略有機會跑（仍保留級聯保護）
      entry_batches:
        - pct: 50
          offset: 0.0
        - pct: 30
          offset: -0.5
        - pct: 20
          offset: -1.0

notification:
  enabled: true
  telegram: true

# 消息面/市場情緒（技術分析之外的第 7 個加權訊號）
sentiment:
  enabled: true
  refresh_seconds: 900            # 15 分鐘更新一次（F&G 每日更新、新聞數分鐘）
  http_timeout: 6.0               # 單一來源逾時秒數；逾時不阻斷交易、退回中性
  fear_greed_weight: 0.6          # 市場情緒（反向：恐慌挺多、貪婪挺空）
  news_weight: 0.4                # 新聞情緒（順勢：利多挺多、利空挺空）
  news_feeds:                     # 免費 RSS，無需金鑰
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://cryptopotato.com/feed/

database:
  url: "sqlite+aiosqlite:///cryptotrade.db"

logging:
  level: INFO
  file: logs/cryptotrade.log

web:
  enabled: true
  host: 127.0.0.1               # 預設僅本機可連，要對外請改 0.0.0.0 並設定 WEB_AUTH_TOKEN
  port: 8899                    # 變更時記得同步 run_bot.bat 的重複啟動守門 port
