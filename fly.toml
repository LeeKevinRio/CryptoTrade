# Fly.io 部署設定 — 24/7 常駐 + 持久磁碟（交易紀錄不隨部署歸零）
# 網址形式：https://<app 名稱>.fly.dev
# 完整步驟見 DEPLOY.md「零、部署到 Fly.io」

# app 名稱在 Fly 全域唯一，被占用時用 fly launch --name <你的名稱> 覆寫
app = "cryptotrade"
primary_region = "sin"      # 新加坡，靠近幣安

[build]
  # 使用 repo 根目錄的 Dockerfile

[env]
  WEB_HOST = "0.0.0.0"
  WEB_PORT = "8899"
  DASHBOARD_AUTH = "true"          # 公網必開：整站（含 WebSocket）都要 token
  BINANCE_TESTNET = "true"         # 上真金才改 false
  TRADING_DISABLED = "false"       # true = 觀察模式，只看不下單
  IMPORT_EXCHANGE_TRADES_DAYS = "30"  # 啟動時從幣安回補 30 天成交，績效不斷層
  DATABASE_URL = "sqlite+aiosqlite:////app/data/cryptotrade.db"
  TZ = "Asia/Taipei"

# ⚠️ 交易 bot 必須「同一時間只有一台機器在跑」——
# 預設的 rolling 部署會讓新舊機器短暫並存，等於兩台引擎對同一個幣安帳戶重複下單。
# immediate：先停舊機再起新機（部署期間短暫離線，但絕不重複交易）。
[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 8899
  force_https = true
  # 交易 bot 必須常駐 —— 關閉自動休眠，且固定單機
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "60s"
    timeout = "10s"
    grace_period = "120s"          # 啟動要載入 7 標的 K 線 + 回補成交紀錄
    method = "GET"
    path = "/healthz"              # 無認證端點，不受 DASHBOARD_AUTH 影響

# SQLite 交易紀錄放持久磁碟，重新部署不遺失（Render 免費方案最大的痛點）
[mounts]
  source = "cryptotrade_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  # pandas 指標運算與啟動回補的尖峰記憶體保險，避免 OOM 重啟
  swap_size_mb = 512
